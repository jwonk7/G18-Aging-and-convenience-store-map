<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>편의점 불빛 지도 · G18</title>

<meta property="og:type" content="website">
<meta property="og:title" content="편의점 불빛 지도 · G18">
<meta property="og:description" content="고령 인구가 많은 지역은 편의점이 적은가? 전국 226개 시군구 공공 통계로 검증했습니다.">
<meta name="theme-color" content="#121214">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121214'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23a1a1a6' opacity='.35'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ffffff'/%3E%3C/svg%3E">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: Apple tile stack (DESIGN.md) — global-nav 44 · sub-nav-frosted 52 · light hero tile · dark product tile (interactive map + readout cards) · parchment footer. Single-look system: light tiles and dark tiles are both part of the design. */
:root{
  /* colors (DESIGN.md) */
  --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --ink:#1d1d1f; --body-on-dark:#ffffff; --body-muted:#cccccc; --ink-80:#333333; --ink-48:#7a7a7a;
  --divider-soft:#f0f0f0; --hairline:#e0e0e0; --canvas:#ffffff; --parchment:#f5f5f7; --pearl:#fafafc;
  --tile-1:#272729; --tile-2:#2a2a2c; --tile-3:#252527; --black:#000000; --chip:#d2d2d7;
  /* data ramp on dark tiles: neutral greys only (no second accent) */
  --d0:#4a4a4f; --d1:#ffffff;
  /* type */
  --f-display:"Plus Jakarta Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-text:"Plus Jakarta Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:var(--f-text);
  /* radius */ --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
  /* spacing */ --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:17px; --s-lg:24px; --s-xl:32px; --s-xxl:48px; --s-section:80px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--canvas);color:var(--ink)}
body{font-family:var(--f-text);font-size:17px;font-weight:400;line-height:1.47;letter-spacing:-0.374px;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;font-feature-settings:"ss03"}
a{color:var(--primary);text-decoration:none}
:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}
.container{max-width:1440px;margin:0 auto;padding-inline:max(16px,4vw)}
.narrow{max-width:980px;margin:0 auto;padding-inline:max(16px,4vw)}

/* global-nav */
.gnav{position:sticky;top:0;z-index:30;color:var(--body-on-dark);padding-top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.7);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px)}
.gnav.open{background:rgba(0,0,0,.82)}
html{scroll-padding-top:calc(96px + env(safe-area-inset-top,0px))}
.gnav .container{height:44px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.gnav .brand{font-size:12px;font-weight:600;letter-spacing:0;color:var(--body-on-dark)}
.gnav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0}
.gnav a{color:var(--body-on-dark);font-size:12px;line-height:1;letter-spacing:-0.12px;opacity:.88}
.gnav a[aria-current="page"]{opacity:1}
.gnav a[aria-disabled="true"]{color:var(--ink-48);opacity:1;cursor:default}
.gnav .meta{font-size:12px;letter-spacing:-0.12px;color:var(--body-muted)}
.menu-btn{display:none;background:transparent;border:0;color:var(--body-on-dark);font:inherit;font-size:12px;padding:8px;cursor:pointer}
.tray{display:none}
@media (max-width:833px){
  .gnav ul,.gnav .meta{display:none}
  .menu-btn{display:block}
  .tray.open{display:block;padding:8px max(16px,4vw) 20px}
  .tray a{display:block;color:var(--body-on-dark);font-size:17px;line-height:2.41;letter-spacing:0}
  .tray a[aria-disabled="true"]{color:var(--ink-48)}
}

/* sub-nav-frosted */
.subnav{position:sticky;top:calc(44px + env(safe-area-inset-top,0px));z-index:20;height:52px;background:rgba(245,245,247,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.subnav .container{height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.subnav .title{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.subnav nav{flex:none}
.subnav nav{display:flex;align-items:center;gap:20px}
.subnav nav a.link{color:var(--ink);font-size:14px;letter-spacing:-0.224px;padding:12px 0}
@media (max-width:640px){.subnav nav a.link{display:none}.subnav .title{font-size:17px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);font-family:var(--f-text);font-size:17px;font-weight:400;letter-spacing:-0.374px;line-height:1;padding:11px 22px;min-height:44px;border:1px solid transparent;cursor:pointer;transition:transform .12s ease}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn-sm{font-size:14px;letter-spacing:-0.224px;padding:7px 15px;min-height:32px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(210,210,215,.64);color:var(--ink);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease;font-family:var(--f-text)}
.icon-btn:active{transform:scale(.95)}
.chip{border-radius:var(--r-pill);padding:12px 16px;font-size:14px;letter-spacing:-0.224px;line-height:1;background:var(--tile-1);color:var(--body-muted);border:1px solid #3a3a3c;cursor:pointer;font-family:var(--f-text);transition:transform .12s ease}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{border:2px solid var(--primary-focus);color:var(--body-on-dark);padding:11px 15px}

/* hero tile (light) */
.tile{padding-block:var(--s-section)}
.hero{background:var(--canvas);text-align:center;padding-block:96px 80px}
.eyebrow{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px;margin:0 0 var(--s-sm);color:var(--ink)}
.hero h1{font-family:var(--f-display);font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-0.28px;margin:0 auto var(--s-lg);max-width:15em;text-wrap:balance}
.hero .lead{font-size:24px;font-weight:300;line-height:1.5;letter-spacing:0;color:var(--ink);max-width:30em;margin:0 auto var(--s-xl)}
.ctas{display:flex;gap:var(--s-md);justify-content:center;flex-wrap:wrap}
@media (max-width:1068px){.hero h1{font-size:40px;line-height:1.1}}
@media (max-width:640px){.hero{padding-block:64px 48px}.hero h1{font-size:34px}.hero .lead{font-size:19px}.tile{padding-block:var(--s-xxl)}}
@media (max-width:419px){.hero h1{font-size:28px}}

/* dark product tile */
.dark{background:var(--tile-1);color:var(--body-on-dark)}
.dark h2{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.1;letter-spacing:0;margin:0 0 var(--s-sm);text-align:center}
.dark .sub{font-size:21px;font-weight:400;line-height:1.38;letter-spacing:.2px;color:var(--body-muted);text-align:center;margin:0 auto var(--s-xxl);max-width:36em}
@media (max-width:640px){.dark h2{font-size:28px}.dark .sub{font-size:17px}}
.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--s-xl);align-items:start}
@media (max-width:1023px){.stage{grid-template-columns:1fr}}
.mapwrap{position:relative;background:var(--tile-3);border-radius:var(--r-lg);overflow:hidden;min-width:0}
.mapwrap svg{display:block;width:100%;height:auto;cursor:grab;user-select:none;-webkit-user-select:none}
.mapwrap svg.dragging{cursor:grabbing}
.land{fill:#323236;stroke:#46464b;stroke-width:1}
.dot{transition:r .18s ease}
.ctrl{position:absolute;right:var(--s-sm);top:var(--s-sm);display:flex;flex-direction:column;gap:var(--s-xs)}
.zoomlabel{position:absolute;left:var(--s-sm);top:var(--s-sm);font-size:12px;letter-spacing:-0.12px;color:var(--body-muted);background:rgba(37,37,39,.8);padding:6px 10px;border-radius:var(--r-sm);font-variant-numeric:tabular-nums}
.maphint{font-size:12px;letter-spacing:-0.12px;color:var(--ink-48);margin:var(--s-sm) 0 0;line-height:1.4}
.toolbar{display:flex;gap:var(--s-xs);flex-wrap:wrap;align-items:center;margin-bottom:var(--s-md)}
.toolbar .lbl{font-size:14px;letter-spacing:-0.224px;color:var(--body-muted);margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:var(--s-lg);align-items:center;margin-top:var(--s-md);font-size:14px;letter-spacing:-0.224px;color:var(--body-muted)}
.ramp{display:inline-block;width:120px;height:6px;border-radius:3px;vertical-align:middle;margin:0 8px}
.sizes{display:inline-flex;align-items:center;gap:8px}
.sizes i{display:inline-block;border-radius:50%;background:var(--body-muted)}

.tip{position:absolute;z-index:5;pointer-events:none;background:var(--pearl);color:var(--ink);border:1px solid rgba(0,0,0,.08);border-radius:var(--r-md);padding:10px 12px;min-width:168px;font-size:14px;line-height:1.29;letter-spacing:-0.224px}
.tip b{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.tip b span{font-weight:400;color:var(--ink-48);margin-left:6px}
.tip dl{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin:0}
.tip dt{color:var(--ink-80)} .tip dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tip dd small{font-weight:400;color:var(--ink-48);margin-left:2px}
/* readout cards (store-utility-card grammar, on dark tile → tile-2 surface) */
.side{display:grid;gap:var(--s-md);min-width:0}
.card{background:var(--tile-2);border-radius:var(--r-lg);padding:var(--s-lg);min-width:0}
.card .k{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-0.224px;color:var(--body-muted);margin:0 0 var(--s-xs);display:flex;justify-content:space-between;gap:8px}
.card .k span{font-weight:400;color:var(--ink-48)}
.who{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.14;letter-spacing:-0.28px;margin:0}
.who small{font-size:17px;font-weight:400;color:var(--body-muted);letter-spacing:-0.374px;margin-left:8px}
.big{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;margin:0}
.big u{text-decoration:none;font-size:17px;font-weight:400;color:var(--body-muted);margin-left:6px;letter-spacing:-0.374px}
.cmp{font-size:14px;letter-spacing:-0.224px;color:var(--body-muted);margin:4px 0 var(--s-sm)}
.strip{display:block;width:100%;height:auto;overflow:visible}
.strip text{font-family:var(--f-text);font-size:11px;fill:var(--ink-48);letter-spacing:0}
.waffle{display:grid;grid-template-columns:repeat(23,minmax(0,1fr));gap:3px;margin-top:var(--s-sm)}
.waffle i{aspect-ratio:1;border-radius:2px;display:block}
.wlegend{display:flex;gap:var(--s-md);flex-wrap:wrap;margin-top:var(--s-sm);font-size:14px;letter-spacing:-0.224px;color:var(--body-muted)}
.wlegend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.wlegend em{font-style:normal;color:var(--body-on-dark);font-variant-numeric:tabular-nums}
.note{font-size:12px;letter-spacing:-0.12px;color:var(--ink-48);margin:var(--s-sm) 0 0;line-height:1.4}

/* footer (parchment) */
footer{background:var(--parchment);color:var(--ink-80);padding-block:64px}
footer h3{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-0.224px;margin:0 0 var(--s-xs);color:var(--ink)}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s-lg) var(--s-xxl)}
.fcols ul{list-style:none;margin:0;padding:0}
.fcols li{font-size:14px;line-height:1.8;letter-spacing:-0.224px}
.legal{border-top:1px solid var(--hairline);margin-top:var(--s-xl);padding-top:var(--s-md);font-size:12px;line-height:1.5;letter-spacing:-0.12px;color:var(--ink-48);display:flex;justify-content:space-between;gap:var(--s-md);flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.btn,.icon-btn,.chip,.dot{transition:none}}

/* language switch (global nav) */
.navright{display:flex;align-items:center;gap:16px}
.langsw{display:flex;gap:2px;background:rgba(255,255,255,.12);border-radius:999px;padding:2px}
.langsw button{background:transparent;border:0;color:var(--body-muted);font-family:var(--f-text);font-size:11px;font-weight:600;letter-spacing:.2px;line-height:1;padding:6px 10px;border-radius:999px;cursor:pointer;min-height:24px;transition:transform .12s ease}
.langsw button:active{transform:scale(0.95)}
.langsw button[aria-pressed="true"]{background:#fff;color:var(--ink)}
@media (max-width:833px){.navright{gap:8px}}

/* line breaking: headings and short lead lines are balanced (even line lengths, no lone last word);
   body copy uses "pretty" to avoid a single orphan word on the last line. Works for both Korean (keep-all) and English. */
h1,h2,h3,.eyebrow,.lead,.sub,.tile-sub,.who,.vt,.fv,.tile-note,.axisnote,.maphint,.flow-note,.vlabel,.dtable caption{text-wrap:balance}
p,li,dd,.why,.note,.cmp,.body-d,.method span,.ql{text-wrap:pretty}

/* shared tile headings (DESIGN.md: display-lg 40/600, lead 21–28) */
.parch{background:var(--parchment);color:var(--ink)}
.tile-h{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.1;letter-spacing:0;margin:0 0 var(--s-sm);text-align:center;text-wrap:balance}
.tile-sub{font-size:21px;font-weight:400;line-height:1.38;letter-spacing:.2px;color:var(--ink-80);text-align:center;margin:0 auto var(--s-xxl);max-width:36em}
.tile-note{font-size:14px;letter-spacing:-0.224px;color:var(--ink-48);text-align:center;margin:var(--s-lg) 0 0}
@media (max-width:640px){.tile-h{font-size:28px}.tile-sub{font-size:17px}}

/* store-utility-card */
.ucard{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--s-lg);min-width:0}
.ucard h3{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px;margin:0 0 var(--s-sm)}
.ucard .wk{font-size:14px;font-weight:600;letter-spacing:-0.224px;color:var(--ink-48);margin:0 0 var(--s-xs);display:flex;justify-content:space-between;gap:8px}
.ucard .wk span{font-weight:400}
.ucard .hyp{font-size:14px;line-height:1.43;letter-spacing:-0.224px;color:var(--ink);background:var(--parchment);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 var(--s-xs)}
.ucard .why{font-size:14px;line-height:1.43;letter-spacing:-0.224px;color:var(--ink-80);margin:var(--s-sm) 0 0}
.ucard .test{font-size:12px;letter-spacing:-0.12px;color:var(--primary);margin:var(--s-sm) 0 0;line-height:1.4}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-lg)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-lg)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-lg);margin-bottom:var(--s-lg)}
@media (max-width:1068px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:834px){.stages,.grid3{grid-template-columns:1fr}}
@media (max-width:640px){.grid4{grid-template-columns:1fr}}
.hdl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:var(--s-xs) 0 0;font-size:14px;line-height:1.43;letter-spacing:-0.224px}
.hdl dt{font-weight:600;color:var(--ink)} .hdl dd{margin:0;color:var(--ink)}

/* estimand */
.estimand{text-align:center;max-width:44em;margin:var(--s-xl) auto var(--s-xxl)}
.eq{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.3;letter-spacing:-0.374px;margin:0 0 var(--s-xs)}
.eqsub{font-size:17px;color:var(--ink-80);margin:0 0 var(--s-md)}
.eqnote{font-size:14px;line-height:1.43;letter-spacing:-0.224px;color:var(--ink-48);margin:0}
@media (max-width:640px){.eq{font-size:24px}}

/* stats */
.stat .statn{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.1;margin:0;font-variant-numeric:tabular-nums}
.stat .statn u{text-decoration:none;font-size:17px;font-weight:400;color:var(--ink-48);margin-left:6px;letter-spacing:-0.374px}

/* threshold chart */
.tcard{padding:var(--s-lg)}
.toolbar.light .lbl{color:var(--ink-48)}
.chip.light{background:var(--canvas);color:var(--ink);border:1px solid var(--hairline)}
.chip.light[aria-pressed="true"]{border:2px solid var(--primary-focus);color:var(--ink)}
.tscroll{overflow-x:auto}
.tsvg{display:block;width:100%;height:auto}
.tchart{width:100%;min-width:0}
.tl{font-family:var(--f-text);font-size:12px;fill:var(--ink-48)}
.axisnote{font-size:12px;letter-spacing:-0.12px;color:var(--ink-48);margin:var(--s-xs) 0 var(--s-md)}
.verdict{border-top:1px solid var(--hairline);padding-top:var(--s-md)}
.verdict .vt{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px;margin:0}

/* system map */
.dagwrap{background:var(--tile-3);padding:var(--s-sm)}
.dag{display:block;width:100%;height:auto}
.dag .node:focus-visible{outline:none}
.dag .node:focus-visible rect,.dag .node:focus-visible ellipse{stroke:var(--primary-focus);stroke-width:3}
.dag .nl{font-family:var(--f-text);font-size:15px;font-weight:600;letter-spacing:-0.2px}
.dag .ns{font-family:var(--f-text);font-size:11px}
.body-d{font-size:17px;line-height:1.47;letter-spacing:-0.374px;color:var(--body-muted);margin:var(--s-sm) 0 0}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;letter-spacing:-0.224px;color:var(--body-muted)}
.kl{display:inline-block;width:28px;height:0;border-top:2px solid #8e8e93;vertical-align:middle;margin-right:10px}
.kl.dash{border-top-style:dashed}
.kl.blue{border-top-color:var(--primary-on-dark)}

/* next tile */
.next{background:var(--canvas);text-align:center;border-top:1px solid var(--divider-soft)}
.next h2{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.1;margin:0 0 var(--s-sm)}
.next .lead{font-size:21px;line-height:1.38;color:var(--ink-80);margin:0 auto var(--s-xl);max-width:30em}

.daggroup{margin:4px 4px 12px}.daggroup .lbl{font-size:12px;color:var(--body-muted);margin:0 0 8px}
.dagchips{display:flex;flex-wrap:wrap;gap:8px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-lg);margin-bottom:var(--s-lg)}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* ---------- data page ---------- */
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s-lg)}
@media (max-width:1068px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:834px){.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.grid5{grid-template-columns:1fr}}
.ucard .tag{font-size:12px;letter-spacing:-0.12px;color:var(--ink-48);margin:var(--s-sm) 0 0}

.sumgrid .why{margin:0}
.sumgrid a{margin-top:auto;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;margin:0 auto var(--s-lg);padding:8px 16px;border-radius:999px;background:#fff3dc;color:#7a4a0c;font-size:15px;font-weight:600}
.pillwrap{text-align:center}
/* merge steps as a vertical timeline */
.timeline{list-style:none;margin:0 auto;padding:0;max-width:860px;display:grid;gap:var(--s-md);counter-reset:none}
.timeline>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:start;position:relative}
.timeline>li::before{content:"";position:absolute;left:19px;top:44px;bottom:calc(-1 * var(--s-md));width:2px;background:#3a3a3c}
.timeline>li:last-child::before{display:none}
.timeline .tnum{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--primary-on-dark);color:#fff;font-weight:600;font-size:16px;position:relative;z-index:1}
.timeline .stepcard .who{font-size:22px}
.timeline .counter{margin:var(--s-md) 0}
.timeline .counter .cn{font-size:32px}
/* threshold: all three readings visible */
.caselist{list-style:none;margin:var(--s-md) 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-sm)}
@media (max-width:834px){.caselist{grid-template-columns:1fr}}
.caselist li{border:1px solid var(--hairline);border-radius:var(--r-md);padding:14px 16px;cursor:pointer}
.caselist li.on{border:2px solid var(--primary);padding:13px 15px}
.caselist b{display:block;font-size:16px;margin-bottom:4px}
.caselist p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-80)}
/* can / cannot say: side by side */
.saycols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-lg);max-width:1000px;margin:0 auto}
@media (max-width:834px){.saycols{grid-template-columns:1fr}}
.saycols h3{margin:0 0 var(--s-sm);font-size:17px;color:var(--body-muted);font-weight:600}
.saycols .saylist li{font-size:17px}
/* district picker (keyboard / screen-reader route into the map) */
.pick{width:100%;margin-top:12px;min-height:44px;border-radius:10px;border:1px solid #48484a;background:var(--tile-1);color:#fff;font:inherit;font-size:15px;padding:8px 12px}
/* contrast + minimum sizes */
.dark .note,.maphint,.dark .tile-note,.flow-note,.dark .card .k span{color:#a8a8ad}
.dark .strip text{fill:#a8a8ad}
.note,.maphint,.flow-note,.zoomlabel{font-size:13px}
.tl{font-size:12.5px}
.tip{font-size:15px}
:focus-visible{outline:3px solid var(--primary-focus);outline-offset:2px}
.dark :focus-visible{outline-color:var(--glow-3)}


/* ===== v4: type, palette, labelled stepper, motion ===== */
:root{--ease:cubic-bezier(.2,.75,.2,1)}
body{font-family:var(--f-text);letter-spacing:-0.01em;color:var(--ink)}
h1,h2,.tile-h,.eq,.who,.fv,.next h2,.dark h2{font-family:var(--f-display);font-weight:600;letter-spacing:-0.02em}
.hero h1{font-weight:600;letter-spacing:-0.025em;line-height:1.12}
.statn,.big,.counter .cn,.sumgrid .n,.herofacts b,.qn{font-family:var(--f-display);font-weight:600;letter-spacing:-0.02em}
.eyebrow{font-family:var(--f-text);font-size:15px;font-weight:600;letter-spacing:.02em}
.tl,.zoomlabel,.method b,.chapnav .cn,.strip text{font-family:var(--f-mono)}
.wk,.card .k,.sumgrid .k{letter-spacing:.01em}
.lead,.tile-sub,.sub{font-weight:400}
.gnav .brand{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:-0.01em}
.hero.hero-lights{background:#1d1d1f}
.heromap .land{fill:#2c2c2e;stroke:#3a3a3c}
.parch{background:var(--parchment)}
.ucard{border-color:var(--hairline);box-shadow:0 1px 0 rgba(20,22,27,.03)}
.btn-primary{background:var(--primary)}
.btn{font-weight:500}
.pill{background:#e8f1fb;color:#0058b0}
.cbar.o i{background:#8e8e93}
.inreal{background:#eef5ff}
/* chapter stepper: every step labelled */
html{scroll-padding-top:calc(124px + env(safe-area-inset-top,0px))}
.chapnav ol{height:66px;gap:0;position:relative}
.chapnav li,.chapnav li:has(a[aria-current="step"]){flex:1 1 0!important;position:relative;min-width:0}
.chapnav li+li::before{content:"";position:absolute;top:20px;left:calc(-50% + 18px);right:calc(50% + 18px);height:2px;border-radius:1px;background:#e0e0e5;transition:background .5s var(--ease)}
.chapnav li:has(a.done)::before,.chapnav li:has(a[aria-current="step"])::before{background:var(--primary)}
.chapnav a{flex-direction:column;justify-content:center;gap:5px;padding:4px 2px;min-height:62px;font-size:11.5px;line-height:1.2;color:var(--ink-48);text-align:center;white-space:nowrap;border-radius:12px}
.chapnav a:hover{background:transparent;color:var(--ink)}
.chapnav .ct{display:block!important;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-text);font-weight:500}
.chapnav .cn{width:26px;height:26px;font-size:12px;background:#e8e8ed;color:var(--ink-48);transition:transform .45s var(--ease),background .45s var(--ease),box-shadow .45s var(--ease),color .45s}
.chapnav a.done{color:var(--ink-80)}
.chapnav a.done .cn{background:#d6e6f8;color:var(--primary)}
.chapnav a[aria-current="step"]{color:var(--ink);font-weight:600}
.chapnav a[aria-current="step"] .cn{background:var(--primary);color:#fff;transform:scale(1.14);box-shadow:0 0 0 5px rgba(0,102,204,.14)}
.chapfill i{background:var(--primary)}
@media (max-width:640px){.chapnav a{font-size:10.5px}.chapnav li+li::before{left:calc(-50% + 16px);right:calc(50% + 16px)}}
/* motion */
@media (prefers-reduced-motion:no-preference){
  .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 80ms)}
  .rv.in{opacity:1;transform:none}
  .heromap .hd{transform-box:fill-box;transform-origin:center;animation:ignite 1.1s var(--ease) both;animation-delay:calc(var(--d) * 1ms)}
  .heromap .hglow{animation:breathe 6s ease-in-out 1.4s infinite alternate both}
  .mapwrap.rv:not(.in) .dot{opacity:0}
  .mapwrap.in .dot{transform-box:fill-box;transform-origin:center;animation:pop .7s var(--ease) both;animation-delay:calc(var(--d,0) * 1ms + 200ms)}
  .chapter>.hero .eyebrow.rv.in::before{animation:pop .6s var(--ease) both .15s}
  .tsvg line,.mini line{transition:x1 .6s var(--ease),x2 .6s var(--ease)}
  .btn,.ucard,.card{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
  a.ucard:hover,.mapguide .card:hover,.sumgrid .ucard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,22,27,.08)}
}
@keyframes ignite{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.35)}100%{opacity:1;transform:scale(1)}}
@keyframes breathe{from{opacity:.62}to{opacity:.95}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}


/* ===== v6: clean, original colour system ===== */
:root{--ink:#1d1d1f;--ink-80:#333336;--ink-48:#6e6e73}
body{font-family:var(--f-text);letter-spacing:-0.005em}
h1,h2,.tile-h,.who,.fv,.next h2,.dark h2{font-family:var(--f-display);font-weight:700;letter-spacing:-0.025em}
.statn,.big,.counter .cn,.sumgrid .n,.herofacts b,.qn{font-family:var(--f-display);font-weight:700;letter-spacing:-0.03em}
.gnav .brand{font-family:var(--f-display);font-weight:700}
.why,.body-d,.mapguide p,.caselist p{font-size:15px;line-height:1.6}
.bgtext p{line-height:1.7}
.hero.hero-lights{background:#1d1d1f}
.hero-lights .eyebrow{color:#2997ff}
.heromap .land{fill:#2c2c2e;stroke:#3a3a3c}
.mapguide .gk{color:#2997ff}
.howto b{color:#fff}
.inreal{background:#eef5ff}
.chapnav a.done .cn{background:#d9e8fa;color:var(--primary)}
.chapnav a[aria-current="step"] .cn{box-shadow:0 0 0 5px rgba(0,102,204,.14)}
.dark :focus-visible{outline-color:#2997ff}
@media (prefers-reduced-motion:no-preference){.heromap .hd{animation:fadein .9s ease both;animation-delay:calc(var(--d) * 0.6ms)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dot{stroke:#1f1f21}
.legend{display:grid;gap:10px;margin-top:var(--s-md)}
.lgrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;color:var(--body-muted)}
.lgt{color:#f5f5f7;font-weight:600;margin-right:4px}
.bins,.sizes{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.bin,.sz{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bin i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #1f1f21}
.sz i{display:inline-block;border-radius:50%;background:#a1a1a6}
/* conclusion */
.concl{background:var(--canvas)}
.concl .qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-lg);margin-bottom:var(--s-xxl)}
@media (max-width:834px){.concl .qa{grid-template-columns:1fr}}
.concl .qa .ucard{padding:28px}
.concl .qa h3{font-size:22px;line-height:1.35;margin:6px 0 10px}
.concl .verdict-k{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:4px 12px}
.concl h3.sec{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-0.02em;margin:0 0 6px}
.concl .secsub{margin:0 0 var(--s-md);color:var(--ink-80);font-size:15px}
.concl section+section,.concl .blk+.blk{margin-top:var(--s-xxl)}
.rtable{width:100%;border-collapse:collapse;font-size:15px;min-width:720px}
.rtable th,.rtable td{padding:14px 12px;border-bottom:1px solid var(--divider-soft);text-align:left;vertical-align:middle}
.rtable thead th{font-size:13px;font-weight:600;color:var(--ink-48);background:var(--parchment)}
.rtable td.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.rtable tr.final td{background:#f5f9ff}
.rtable .tagf{margin-left:8px;font-size:11px;font-weight:700;color:#fff;background:var(--primary);border-radius:999px;padding:2px 8px;vertical-align:1px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st.in{background:#f0f0f2;color:#333336}.st.cross{background:#fff4e5;color:#8a4b00}.st.below{background:#e8f1fb;color:#0058b0}
.rwrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r-lg)}
.mvr{display:grid;gap:12px}
.mvr .row{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.3fr);gap:16px;align-items:stretch}
@media (max-width:834px){.mvr .row{grid-template-columns:1fr}.mvr .arr{display:none}}
.mvr .myth,.mvr .real{border-radius:var(--r-md);padding:16px 18px;font-size:15px;line-height:1.55}
.mvr .myth{background:var(--parchment);color:var(--ink-80)}
.mvr .real{background:#fff;border:1px solid var(--hairline);color:var(--ink)}
.mvr .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.mvr .myth .lab{color:var(--ink-48)}.mvr .real .lab{color:var(--primary)}
.mvr .arr{display:flex;align-items:center;justify-content:center;color:var(--ink-48);font-size:20px}
.impl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-lg)}
@media (max-width:900px){.impl{grid-template-columns:1fr}}
.impl .ucard h4{margin:0 0 8px;font-size:17px;line-height:1.4}
.impl .ucard p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-80)}
.callout{margin-top:var(--s-xxl);background:#1d1d1f;color:#f5f5f7;border-radius:var(--r-lg);padding:32px}
.callout .k{margin:0 0 8px;font-size:13px;font-weight:700;color:#2997ff;letter-spacing:.04em;text-transform:uppercase}
.callout p.big2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.45;font-weight:600;letter-spacing:-0.015em}


/* ===== v7: website navigation ===== */
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
.sitenav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);padding-top:env(safe-area-inset-top,0px)}
.snrow{height:64px;display:flex;align-items:center;gap:20px}
.snbrand{display:flex;align-items:center;gap:10px;color:var(--ink);flex:none;min-width:0}
.snbrand b{display:block;font-family:var(--f-display);font-size:15px;font-weight:800;line-height:1.15;letter-spacing:-0.01em}
.snsub{display:block;font-size:12px;color:var(--ink-48);line-height:1.25;white-space:nowrap}
.snlinks{display:flex;gap:2px;margin:0 auto;height:100%;align-items:stretch}
.snlinks .nl{display:flex;align-items:center;position:relative;padding:0 14px;font-size:14.5px;font-weight:500;color:var(--ink-80);white-space:nowrap;transition:color .2s}
.snlinks .nl:hover{color:var(--ink)}
.snlinks .nl::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:var(--primary);transform:scaleX(0);transition:transform .3s var(--ease,ease)}
.snlinks .nl.on{color:var(--ink);font-weight:600}
.snlinks .nl.on::after{transform:scaleX(1)}
.snright{display:flex;align-items:center;gap:12px;flex:none;margin-left:auto}
.snlinks+.snright{margin-left:0}
.snlang{display:flex;background:#f0f0f2;border-radius:999px;padding:3px}
.snlang button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink-48);padding:5px 11px;border-radius:999px;cursor:pointer;min-height:28px}
.snlang button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sncta{white-space:nowrap}
.snmenu{display:none;width:40px;height:40px;border:0;background:transparent;border-radius:10px;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:0}
.snmenu span{display:block;width:18px;height:2px;border-radius:1px;background:var(--ink);transition:transform .25s,opacity .2s}
.sitenav.open .snmenu span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.sitenav.open .snmenu span:nth-child(2){opacity:0}
.sitenav.open .snmenu span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.snpanel{display:none}
.snprog{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.snprog i{display:block;height:2px;background:var(--primary);transform-origin:0 50%;transform:scaleX(0)}
@media (max-width:1060px){
  .snlinks,.sncta{display:none}
  .snmenu{display:flex}
  .snlinks+.snright{margin-left:auto}
  .sitenav.open .snpanel{display:block;border-top:1px solid var(--divider-soft);background:#fff;max-height:calc(100vh - 64px);overflow:auto}
  .snpanel nav{display:grid;padding-block:8px 16px}
  .snpanel .nl{display:block;padding:14px 4px;font-size:17px;font-weight:500;color:var(--ink-80);border-bottom:1px solid var(--divider-soft)}
  .snpanel .nl.on{color:var(--primary);font-weight:600}
  .snpanel .ncta{border-bottom:0;color:var(--primary);font-weight:600}
}
@media (max-width:420px){.snsub{display:none}.snrow{gap:12px}}


/* ===== v8: numbered steps in the bar ===== */
.nl .cn{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#e8e8ed;color:var(--ink-48);font-variant-numeric:tabular-nums;transition:background .3s,color .3s,transform .3s var(--ease,ease),box-shadow .3s}
.nl.done .cn{background:#d9e8fa;color:var(--primary)}
.nl.on .cn{background:var(--primary);color:#fff;transform:scale(1.08);box-shadow:0 0 0 4px rgba(0,102,204,.14)}
.snlinks{gap:0}
.snlinks .nl{gap:8px;padding:0 12px}
.snlinks .nl:not(:first-child)::before{content:"";width:16px;height:2px;border-radius:1px;background:#dcdce1;margin-right:4px;margin-left:-8px}
.snlinks .nl.done+.nl::before,.snlinks .nl.on::before{background:var(--primary)}
.snlinks .nl::after{display:none}
.snsteps{display:none}
.snpanel .nl{display:flex!important;align-items:center;gap:12px}
@media (max-width:1060px){
  .snsteps{display:block;border-top:1px solid var(--divider-soft)}
  .snsteps .container{display:flex;height:58px;align-items:stretch}
  .snsteps .nl{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink-48);line-height:1.2;text-align:center}
  .snsteps .nl .ct{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .snsteps .nl.on{color:var(--ink);font-weight:700}
  .snsteps .nl+.nl::before{content:"";position:absolute;top:19px;left:calc(-50% + 16px);right:calc(50% + 16px);height:2px;border-radius:1px;background:#dcdce1}
  .snsteps .nl.done+.nl::before,.snsteps .nl.on::before{background:var(--primary)}
  html{scroll-padding-top:calc(132px + env(safe-area-inset-top,0px))}
}

/* findings */
.mini{max-width:340px}
.fnum{margin:var(--s-sm) 0 0;font-size:13px;line-height:1.5;color:var(--ink-48);letter-spacing:-0.12px;font-variant-numeric:tabular-nums}
.fnum b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

"노인이 늘면 혼자 사는 어르신도 늘고, 1인가구는 편의점을 자주 이용합니다. 이는 노인 비율이 편의점에 영향을 주는 경로 자체이므로 통제 변수에 포함하지 않았습니다.": "More elderly residents means more older people living alone, and people who live alone use convenience stores frequently. This is part of the mechanism through which age affects store numbers rather than a confounder, so we did not control for it.",
"노인이 많은 지역에서는 편의점 대신 동네 슈퍼마켓이 자리 잡는 경우도 있습니다. 이 역시 노인 비율에서 편의점으로 이어지는 경로이므로 통제하지 않았습니다.": "In older neighborhoods, a local supermarket sometimes takes the place of a convenience store. This is also part of the path from age to store numbers, so it was not included as a control.",

/* measure an element's rendered width so SVG charts can be drawn at real pixel size (text never shrinks on phones) */
function useWidth(ref,fallback){
  const [w,setW]=useState(fallback);
  React.useLayoutEffect(()=>{const el=ref.current; if(!el) return;
    const set=()=>{const v=Math.round(el.getBoundingClientRect().width); if(v>0) setW(v);};
    set(); if(typeof ResizeObserver==='undefined'){window.addEventListener('resize',set); return ()=>window.removeEventListener('resize',set);}
    const ro=new ResizeObserver(set); ro.observe(el); return ()=>ro.disconnect();},[]);
  return w;
}

function pageOf(hash){
  const h0=(hash||'').replace(/^#/,'');
  if(PAGES.some(p=>p.id===h0&&p.ready)) return h0;
  if(h0.startsWith('hyp-')) return 'hypothesis';
  if(h0.startsWith('data-')) return 'data';
  if(h0.startsWith('ana-')) return 'analysis';
  if(h0.startsWith('int-')) return 'interpretation';
  return ANCHOR_PAGE[h0]||'home';
}

function useZoom(svgRef){
  const [v,setV]=useState({k:1,tx:0,ty:0});
  const ptrs=useRef(new Map()); const drag=useRef(null); const moved=useRef(false);
  const limit=(k,tx,ty)=>{k=clamp(k,1,12);
    const minX=VB.x+VB.w-k*(VB.x+VB.w), maxX=VB.x-k*VB.x, minY=VB.y+VB.h-k*(VB.y+VB.h), maxY=VB.y-k*VB.y;
    return {k,tx:clamp(tx,minX,maxX),ty:clamp(ty,minY,maxY)};};
  const toSvg=(cx,cy)=>{const s=svgRef.current; const pt=s.createSVGPoint(); pt.x=cx; pt.y=cy; const q=pt.matrixTransform(s.getScreenCTM().inverse()); return [q.x,q.y];};
  const zoomAt=useCallback((sx,sy,f)=>setV(o=>{const k2=clamp(o.k*f,1,12); const r=k2/o.k; return limit(k2,sx-(sx-o.tx)*r,sy-(sy-o.ty)*r);}),[]);
  const zoomCenter=f=>zoomAt(VB.x+VB.w/2,VB.y+VB.h/2,f);
  const reset=()=>setV({k:1,tx:0,ty:0});
  useEffect(()=>{const s=svgRef.current; if(!s) return;
    const onWheel=e=>{ if(!(e.ctrlKey||e.metaKey)) return; e.preventDefault(); const [x,y]=toSvg(e.clientX,e.clientY); zoomAt(x,y,Math.exp(-e.deltaY*0.01)); };
    s.addEventListener('wheel',onWheel,{passive:false}); return ()=>s.removeEventListener('wheel',onWheel);},[zoomAt]);
  const scale=()=>{const r=svgRef.current.getBoundingClientRect(); return VB.w/r.width;};
  const handlers={
    onPointerDown:e=>{ptrs.current.set(e.pointerId,[e.clientX,e.clientY]); moved.current=false;
      if(ptrs.current.size===1) drag.current={x:e.clientX,y:e.clientY};
      if(ptrs.current.size===2){const [a,b]=[...ptrs.current.values()]; drag.current={pinch:Math.hypot(a[0]-b[0],a[1]-b[1])};}},
    onPointerMove:e=>{ if(!ptrs.current.has(e.pointerId)) return; ptrs.current.set(e.pointerId,[e.clientX,e.clientY]);
      if(ptrs.current.size===2&&drag.current&&drag.current.pinch){const [a,b]=[...ptrs.current.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
        const [x,y]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2); zoomAt(x,y,d/drag.current.pinch); drag.current.pinch=d; moved.current=true; return;}
      if(ptrs.current.size===1&&drag.current&&!drag.current.pinch){const dx=e.clientX-drag.current.x, dy=e.clientY-drag.current.y;
        if(Math.abs(dx)+Math.abs(dy)>3){moved.current=true; if(!svgRef.current.hasPointerCapture(e.pointerId)) svgRef.current.setPointerCapture(e.pointerId); svgRef.current.classList.add('dragging');}
        if(moved.current){const s=scale(); setV(o=>limit(o.k,o.tx+dx*s,o.ty+dy*s)); drag.current={x:e.clientX,y:e.clientY};}}},
    onPointerUp:e=>{ptrs.current.delete(e.pointerId); if(ptrs.current.size===0){drag.current=null; svgRef.current&&svgRef.current.classList.remove('dragging');}},
    onPointerCancel:e=>{ptrs.current.delete(e.pointerId); drag.current=null;},
    onDoubleClick:e=>{const [x,y]=toSvg(e.clientX,e.clientY); zoomAt(x,y,2);}
  };
  return {v,handlers,zoomCenter,reset,moved};
}

  const ref=useRef(null); const W=useWidth(ref,620); const H=Math.round(clamp(W*0.62,260,380)),LM=W<480?36:48,R=12,T=16,B=44, xlo=10,xhi=50, ylo=0,yhi=3.4;
  const x=v=>LM+(clamp(v,xlo,xhi)-xlo)/(xhi-xlo)*(W-LM-R), y=v=>H-B-(clamp(v,ylo,yhi)-ylo)/(yhi-ylo)*(H-T-B);
  const corr=pts=>{const mx=mean(pts.map(p=>p.o)), my=mean(pts.map(p=>p.c)); let sxy=0,sxx=0,syy=0; pts.forEach(p=>{sxy+=(p.o-mx)*(p.c-my); sxx+=(p.o-mx)**2; syy+=(p.c-my)**2;}); return sxy/Math.sqrt(sxx*syy);};
  const fits=useMemo(()=>Object.fromEntries(['자치구','시','군'].map(t=>{const pts=DATA.filter(p=>p.t===t); const f=fitLine(pts);
    const sc=[...pts].sort((a,b)=>b.c-a.c);
    return [t,{...f,r:corr(pts),lo:Math.min(...pts.map(p=>p.o)),hi:Math.max(...pts.map(p=>p.o)),top:sc[0],bot:sc[sc.length-1]}];})),[]);
  const all=useMemo(()=>fitLine(DATA),[]);
  const line=(f,lo,hi,on,key)=>h('line',{key,x1:x(lo),y1:y(f.a+f.b*lo),x2:x(hi),y2:y(f.a+f.b*hi),style:{stroke:on?'var(--primary)':'#c7c7cc',strokeWidth:on?3:1.5,strokeLinecap:'round'}});

  return h('section',{className:'tile',id:'ana-type',style:{background:'var(--canvas)'}},h('div',{className:'container'},
    h('h2',{className:'tile-h'},'도시와 시골을 나눠 보면'),
    h('p',{className:'tile-sub'},'점 하나가 동네 하나입니다. 오른쪽으로 갈수록 노인이 많고, 위로 갈수록 편의점이 많습니다.'),
    h('div',{className:'scwrap'},
      h('div',{className:'ucard'},
        h('div',{className:'toolbar light',role:'group','aria-label':'지역 종류'},
          [['자치구','구 (대도시)'],['시','시'],['군','군 (시골)']].map(([k,l])=>h('button',{key:k,className:'chip light','aria-pressed':ty===k,onClick:()=>setTy(k)},l))),
        h('div',{className:'tchart',ref},h('svg',{viewBox:`0 0 ${W} ${H}`,className:'tsvg',role:'img','aria-label':'고령 비율과 편의점 밀도의 산점도'},
          [10,20,30,40,50].map(t=>h('g',{key:'x'+t},h('line',{x1:x(t),x2:x(t),y1:T,y2:H-B,style:{stroke:'#e8e8ed'}}),h('text',{x:x(t),y:H-B+18,textAnchor:'middle',className:'tl'},t+'%'))),
          [0,1,2,3].map(t=>h('g',{key:'y'+t},h('line',{x1:LM,x2:W-R,y1:y(t),y2:y(t),style:{stroke:'#e8e8ed'}}),h('text',{x:LM-8,y:y(t)+4,textAnchor:'end',className:'tl'},t))),
          h('text',{x:(LM+W-R)/2,y:H-6,textAnchor:'middle',className:'tl'},'고령 비율 →'),
          h('text',{x:14,y:(T+H-B)/2,textAnchor:'middle',className:'tl',transform:`rotate(-90 14 ${(T+H-B)/2})`},'1,000명당 편의점 →'),
          DATA.filter(p=>p.t!==ty).map(p=>h('circle',{key:p.n,cx:x(p.o),cy:y(p.c),r:3,style:{fill:'#d2d2d7'}})),
          DATA.filter(p=>p.t===ty).map(p=>h('circle',{key:p.n,cx:x(p.o),cy:y(p.c),r:hv&&hv.n===p.n?7:4,style:{fill:'var(--primary)',opacity:.75,stroke:hv&&hv.n===p.n?'#1d1d1f':'none',cursor:'pointer'},onPointerEnter:()=>setHv(p),onPointerLeave:()=>setHv(null)})),
          h('line',{x1:x(xlo+1),y1:y(all.a+all.b*(xlo+1)),x2:x(xhi-1),y2:y(all.a+all.b*(xhi-1)),style:{stroke:'#8e8e93',strokeWidth:1.5,strokeDasharray:'5 4'}}),
          h('text',{x:x(xhi-1),y:y(all.a+all.b*(xhi-1))-8,textAnchor:'end',className:'sclab',style:{fill:'#7a7a7a'}},L('전체 226곳','All 226')),
          line(fits[ty],fits[ty].lo,fits[ty].hi,true,'f'),
          !hv&&[fits[ty].top,fits[ty].bot].map((p,i)=>h('g',{key:'lab'+i,style:{pointerEvents:'none'}},
            h('circle',{cx:x(p.o),cy:y(p.c),r:6,style:{fill:'none',stroke:'#1d1d1f',strokeWidth:1.2}}),
            h('text',{x:clamp(x(p.o),LM+50,W-R-50),y:i===0?y(p.c)-11:y(p.c)+18,textAnchor:'middle',className:'sclab'},`${nm(p.n)} ${p.c.toFixed(2)}`))),

          h('p',{className:'why'},Math.abs(s)<0.1?'노인이 10%p 많아도 편의점 수는 거의 같습니다.':s<0?L(`노인이 10%p 많으면 1,000명당 편의점이 ${Math.abs(s).toFixed(2)}개 적습니다.`,`With 10 pp more elderly residents, ${Math.abs(s).toFixed(2)} fewer stores per 1,000.`):L(`노인이 10%p 많으면 오히려 ${s.toFixed(2)}개 많습니다.`,`With 10 pp more elderly residents, actually ${s.toFixed(2)} more.`)));}))),
    h('div',{className:'scread'},h('b',null,L('읽는 법 · ','How to read · ')),
      L('파란 선이 오른쪽 아래로 기울수록 “노인이 많을수록 편의점이 적다”는 통념과 맞습니다. 회색 점선은 226곳 전체로 그은 선인데 거의 평평합니다(r = −0.05). 군만 따로 보면 선이 뚜렷하게 내려갑니다(r = −0.33). 동그라미 친 두 점은 선택한 지역 종류에서 편의점이 가장 많은 곳과 가장 적은 곳입니다.',
        'The more the blue line slopes down to the right, the more the data match the belief that older areas have fewer stores. The grey dashed line uses all 226 districts and is almost flat (r = −0.05). For rural counties (gun) alone, the line clearly falls (r = −0.33). The two circled dots are the districts with the most and fewest stores in the selected group.')),
    h(Method,null,'단순 선형회귀: 구·시·군 각각에서 고령 비율로 1,000명당 편의점 수를 설명하는 직선을 그렸습니다(최소제곱법). 카드의 숫자는 그 직선의 기울기 × 10입니다.'),
    h('p',{className:'tile-note'},'군에서만 기울기가 의미 있게 아래로 향합니다. 다만 군끼리도 소득·인구밀도를 맞추면 범위가 넓어져(−0.70 ~ +0.14개) 확실하다고는 말하기 어렵습니다.')));

    const SEL='main .tile-h,main .tile-sub,main .dark h2,main .dark .sub,main .eyebrow,main .chapter>.hero h1,main .chapter>.hero .lead,main .ucard,main .side>.card,main .mapguide .card,main .mapwrap,main .timeline>li,main .saylist li,main .nsteps li,main .final,main .takeaway p,main .scread,main .bgtext p,main .pillwrap,main .howto,main .verify>*';
    const vh=window.innerHeight; const parents=new Map();
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in'); io.unobserve(e.target);}}),{threshold:0.12,rootMargin:'0px 0px -6% 0px'});
    document.querySelectorAll(SEL).forEach(el=>{
      if(el.getBoundingClientRect().top<vh*0.9) return;
      const par=el.parentElement; const k=parents.get(par)||0; parents.set(par,k+1);
      el.style.setProperty('--i',Math.min(k,5)); el.classList.add('rv'); io.observe(el);});
    const count=el=>{const tn=[...el.childNodes].find(n=>n.nodeType===3&&/\d/.test(n.nodeValue)); if(!tn) return;
      const orig=tn.nodeValue, m=orig.match(/[\d][\d,]*(\.\d+)?/); if(!m) return;
      const target=parseFloat(m[0].replace(/,/g,'')), dec=m[1]?m[1].length-1:0, comma=m[0].includes(','); let t0=null;
      const fmtN=v=>{let s=v.toFixed(dec); if(comma) s=Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return s;};
      const step=ts=>{if(t0==null) t0=ts; const f=Math.min(1,(ts-t0)/1100), e=1-Math.pow(1-f,3);
        tn.nodeValue=f<1?orig.replace(m[0],fmtN(target*e)):orig; if(f<1) requestAnimationFrame(step);};
      requestAnimationFrame(step);};
    const cio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cio.unobserve(e.target); count(e.target);}}),{threshold:0.5});
    document.querySelectorAll('#home .statn,#home .herofacts b,#home .sumgrid .n').forEach(el=>cio.observe(el));
    return ()=>{io.disconnect(); cio.disconnect();};
  },[lang]);
  useEffect(()=>{const id=decodeURIComponent((location.hash||'').slice(1)); if(id){const el=document.getElementById(id); if(el) el.scrollIntoView();}},[]);
  return h(React.Fragment,null,
    h('a',{className:'skip',href:'#main'},L('본문으로 건너뛰기','Skip to content')),
    h(SiteNav,{lang,setLang,cur,fill}),
    h('main',{id:'main',key:lang},
      h('div',{id:'home'},h(Hero),h(Summary),h(Background),h(Guide),h(MapTile)),
      h('div',{id:'hypothesis',className:'chapter'},h(HypothesisPage)),
      h('div',{id:'data',className:'chapter'},h(DataPage)),
      h('div',{id:'analysis',className:'chapter'},h(AnalysisPage)),
      h('div',{id:'interpretation',className:'chapter'},h(InterpretationPage))),
    h(Footer));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
